<head>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="deck-topbar">
    <a id="backLink" href="index.html#mapa">← <span id="sessionLabel">Cargando…</span></a>

    <button id="btnNext" title="Siguiente (→ / espacio)">›</button>
    <button id="btnFull" title="Pantalla completa (f)">⛶</button>
    <a id="nextSession" style="color:var(--mist);text-decoration:none">sesión ›</a>
  </div>
</div>

<script src="assets/sessions-data.js"></script>
